name: macOS

# Compile et teste sur un vrai Mac (runner Apple Silicon), faute d'en avoir un
# sous la main. Le runner n'a ni écran ni GPU : il attrape les échecs de
# compilation et d'édition de liens, pas les problèmes d'exécution (contexte
# OpenGL, recherche du dossier assets), qui restent à vérifier sur une machine.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # CMake et clang sont préinstallés sur le runner ; libcurl et le framework
      # OpenGL viennent du SDK. Rien à installer, donc pas d'étape brew.

      - name: Cache des dépendances FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('cmake/Dependencies.cmake') }}

      # CMAKE_POLICY_VERSION_MINIMUM=3.5 : même raison que pour les autres
      # plateformes, les runners ont CMake 4.x, qui refuse le vieux
      # cmake_minimum_required de certaines dépendances.
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Compiler
        run: cmake --build build -j

      - name: Tester
        run: ctest --test-dir build --output-on-failure
