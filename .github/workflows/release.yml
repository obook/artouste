name: Release

# Construit les exécutables Linux et Windows et publie une release GitHub avec
# les deux archives. Se déclenche au push d'un tag de version (v1.2.3), ou
# manuellement depuis l'onglet Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GLFW a besoin des en-têtes X11 et OpenGL ; GLAD génère ses sources via
      # Python (déjà présent sur le runner). libcurl (paquet de développement)
      # est désormais obligatoire : la radio internet du cockpit en dépend.
      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libcurl4-openssl-dev

      # Accélère les builds suivants : on garde les sources tierces clonées par
      # FetchContent (assimp est volumineux).
      - name: Cache des dépendances FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake') }}

      # CMAKE_POLICY_VERSION_MINIMUM=3.5 : les runners ont CMake 4.x, qui refuse le
      # vieux cmake_minimum_required de certaines dependances (GLAD). Cette option
      # leur accorde une compatibilite minimale.
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Compiler
        run: cmake --build build -j

      - name: Tester
        run: ctest --test-dir build --output-on-failure

      - name: Empaqueter
        run: cd build && cpack

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: artouste-linux
          path: build/artouste-*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache des dépendances FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake') }}

      # libcurl (radio internet du cockpit) via vcpkg, en statique : tout est
      # fondu dans artouste.exe, aucune DLL à embarquer dans le zip. Le triplet
      # x64-windows-static utilise le CRT statique (/MT), comme le reste du
      # projet (CMAKE_MSVC_RUNTIME_LIBRARY dans CMakeLists.txt). Un triplet -md
      # (CRT dynamique) provoquerait des symboles __imp_ non résolus à l'édition
      # de liens.
      - name: Installer libcurl (vcpkg, statique)
        shell: bash
        run: vcpkg install curl:x64-windows-static

      # En bash (present sur le runner) : PowerShell decoupe sinon l'argument
      # -DCMAKE_POLICY_VERSION_MINIMUM=3.5 au point decimal. La toolchain vcpkg
      # et le triplet statique exposent libcurl a find_package(CURL).
      - name: Configurer
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Compiler
        run: cmake --build build --config Release -j

      - name: Tester
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Empaqueter
        run: cd build && cpack -C Release

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: artouste-windows
          path: build/artouste-*.zip
          if-no-files-found: error

  release:
    name: Publier la release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    # Une release n'est créée que pour un tag, pas pour un lancement manuel.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Ce job ne compile rien, mais il lui faut quand même le dépôt : le texte de
      # la release est lu dans docs/RELEASE_NOTES.md ci-dessous. Sans ce checkout,
      # body_path désignerait un fichier absent et l'action retomberait sur une
      # description vide, sans échouer. En premier, car actions/checkout nettoie le
      # répertoire de travail : après le téléchargement, il effacerait les archives.
      - uses: actions/checkout@v4

      - name: Récupérer les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts

      # Le texte de la release vit dans docs/RELEASE_NOTES.md, écrit à la main
      # AVANT de poser le tag et versionné avec le code qu'il décrit. Il part donc
      # avec les archives, sans rien à coller après coup : l'action créant la
      # release quand elle n'existe pas encore, elle naissait vide.
      # generate_release_notes reste à false : la liste plate des sujets de commits
      # n'apprend rien à un joueur.
      - name: Attacher les archives et le texte à la release
        uses: softprops/action-gh-release@v2
        with:
          files: artefacts/**/artouste-*
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: false
          # Un tag portant un tiret (v0.30.0-rc1, v0.0.0-essai) est un essai ou une
          # version candidate : publié en pré-release, il ne devient pas la version
          # que propose le bouton de téléchargement du dépôt.
          prerelease: ${{ contains(github.ref_name, '-') }}

  page:
    name: Inscrire le tag dans la page
    needs: [release]
    runs-on: ubuntu-latest
    # Même garde que la release, plus une seconde : un lancement manuel ne publie
    # rien, et un tag d'essai ou de version candidate (portant un tiret) ne doit pas
    # inscrire son numéro dans la page vue par les visiteurs.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    steps:
      # Le tag est un état détaché ; la page, elle, est servie par GitHub Pages
      # depuis docs/ sur main. C'est donc main qu'on met à jour, et le push
      # déclenche la reconstruction de la page.
      - uses: actions/checkout@v4
        with:
          ref: main

      # Le numéro est écrit en clair dans la page, à deux endroits repérables :
      # le contenu des liens de classe "release-tag" (un par langue, sous les
      # boutons de téléchargement) et le champ softwareVersion des données
      # structurées, qui lui s'écrit sans le "v" du tag. Rien à charger côté
      # visiteur, et le numéro reste affiché sans JavaScript.
      - name: Inscrire le tag dans docs/index.html
        run: |
          sed -i \
            -e 's|\(<a class="release-tag"[^>]*>\)[^<]*\(</a>\)|\1'"$GITHUB_REF_NAME"'\2|g' \
            -e 's|"softwareVersion": "[^"]*"|"softwareVersion": "'"${GITHUB_REF_NAME#v}"'"|' \
            docs/index.html
          grep -n 'release-tag\|softwareVersion' docs/index.html

      # Rien à pousser si le numéro est déjà le bon (relance du workflow sur un
      # tag déjà traité) : sans ce garde-fou, git commit échouerait sur un index
      # vide et ferait échouer le job pour rien.
      - name: Commiter le numéro s'il a changé
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "La page porte déjà le numéro $GITHUB_REF_NAME."
            exit 0
          fi
          # Identité de l'auteur du dépôt, et non celle du robot : ce commit est
          # celui de la release que vous venez de poser, pas la contribution d'un
          # tiers. Signer avec le compte du robot le faisait apparaître dans la
          # liste des contributeurs du projet.
          git config user.name "Olivier Booklage"
          git config user.email "obooklage@free.fr"
          git add docs/index.html
          git commit -m "docs(page): Version $GITHUB_REF_NAME"
          git push
